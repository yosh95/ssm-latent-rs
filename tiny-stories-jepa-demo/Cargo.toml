[package]
name = "tiny-stories-jepa-demo"
version = "0.2.0"
edition = "2021"
default-run = "tiny-stories-jepa-demo"

[dependencies]
burn = { version = "0.21", default-features = false, features = ["train", "wgpu"] }
tiktoken = "3.5.1"
ureq = { version = "3", default-features = false, features = ["_tls"] }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.43", default-features = false, features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
# Reference the core logic from the project root
ssm-latent-model = { path = "..", default-features = false, features = ["std", "ndarray", "autodiff"] }
